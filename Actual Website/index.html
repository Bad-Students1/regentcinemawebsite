<!DOCTYPE html>

<html lang="en-NZ">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>The Regent Cinema — Ashburton</title>

<meta
    name="description"
    content="The Regent Cinema, Wills Street, Ashburton. Two screens, family-run, showing the latest movies every day."
>

<link rel="stylesheet" href="css/index.css">

<link
    rel="icon"
    type="image/png"
    href="images/logo_icon_R.png"
    id="nav_logo"
>

<!-- Load schedule data first -->
<script src="javascript/schedule.js"></script>

<!-- Load website functionality after -->
<script src="javascript/index.js" defer></script>


</head>

<body>


<header>

    <nav>

        <a class="logo_link" href="#home">
            <img
                src="images/logo_rectangle.jpg"
                alt="Regent Cinema Logo"
            >
        </a>


        <div class="nav-links">

            <a class="nav-button" href="#home">
                Home
            </a>

            <a class="nav-button" href="#now-showing">
                Now Showing
            </a>

            <a class="nav-button" href="#location">
                Location
            </a>

            <a class="nav-button" href="#contact-us">
                Contact us
            </a>

            <a class="nav-button" id="bookingBtn">
                Make a Booking
            </a>

        </div>

    </nav>

</header>


<hr>


<main>

    <div id="hero_image">

        <h1 id="overlay">
            Serving Ashburton since 1953
        </h1>

    </div>


    <section id="now-showing">

        <h2 class="movie-section-header">
            Showtimes for this week
        </h2>


        <div id="weekTabs"></div>


        <div id="movieGrid"></div>

    </section>

</main>


<footer>

    <div>

        <p id="copyright">
            &copy; Regent Cinema
        </p>

    </div>


    <div id="contact-us">

        <p class="Contact1">
            Contact us:
        </p>

        <p class="Contact1">
            Phone Number: 03 307 1230
        </p>

        <p class="Contact1">
            Movieline: 03 308 1230
        </p>

        <p class="Contact1">
            Email Address: bookings@regentcinema.co.nz
        </p>

    </div>

</footer>

</body>

</html>
